<!-- ═══════════════════════════════ HEADER ═══════════════════════════════ -->
<header class="fixed top-4 inset-x-0 mx-auto z-50 w-full max-w-5xl px-4 animate-rise delay-100">
  <div class="marsa-nav relative flex items-center gap-4 px-4 md:px-5 h-14 rounded-marsa-pill">

    <!-- Mobile: pinned to the physical right cluster (menu toggle owns the left,
         toggles sit at right-3; right-16 <sm / right-40 sm..md keeps clear gaps
         at 320px, 375px, and 640px). Desktop md+: back in flow. -->
    <a class="flex items-center gap-2.5 hover:opacity-75 transition-opacity shrink-0 absolute right-16 sm:right-40 top-1/2 -translate-y-1/2 md:static md:translate-y-0"
    routerLink="/" [attr.aria-label]="text(navData.home)" (click)="closeMenu()">
      <span class="flex gap-[3px] items-end" aria-hidden="true">
        <span class="w-[3px] h-3.5 bg-marsa-sand rounded-full"></span>
        <span class="w-[3px] h-5 bg-marsa-sand rounded-full"></span>
        <span class="w-[3px] h-3 bg-marsa-sand rounded-full"></span>
      </span>
      <span class="font-bold text-sm tracking-widest text-marsa-pearl">AL MARSA</span>
      <span class="text-sm text-marsa-pearl opacity-40 px-1">|</span>
      <span class="font-semibold text-sm text-marsa-pearl opacity-60">المرسى</span>
    </a>

    <!-- Desktop Nav (fragments keep browser history/refresh consistent) -->
    <nav class="hidden md:flex items-center gap-7 flex-1 justify-center text-xs font-medium" [attr.aria-label]="text(navData.menu)">
      <a routerLink="/" fragment="why"   class="text-marsa-pearl/70 hover:text-marsa-pearl transition-colors tracking-wide">{{ text(navData.why) }}</a>
      <a routerLink="/" fragment="how"   class="text-marsa-pearl/70 hover:text-marsa-pearl transition-colors tracking-wide">{{ text(navData.how) }}</a>
      <a routerLink="/" fragment="about" class="text-marsa-pearl/70 hover:text-marsa-pearl transition-colors tracking-wide">{{ text(navData.about) }}</a>
    </nav>

    <!-- Actions -->
    <!-- Mobile: pinned to the physical right edge next to the brand; desktop: in flow at the end -->
    <div class="flex items-center gap-2 md:gap-3 shrink-0 absolute right-3 top-1/2 -translate-y-1/2 md:static md:translate-y-0 md:ml-auto">

      <!-- Theme toggle -->
      <button class="flex items-center justify-center w-8 h-8 rounded-full hover:bg-white/10 transition-colors text-marsa-pearl/70 hover:text-marsa-pearl"
        type="button" (click)="preferences.toggleTheme($event)" [attr.aria-label]="text(navData.switchTheme)">
        <svg *ngIf="isLightTheme()" lucideSun    class="w-4 h-4" aria-hidden="true"></svg>
        <svg *ngIf="!isLightTheme()" lucideMoon   class="w-4 h-4" aria-hidden="true"></svg>
      </button>

      <!-- Locale toggle — accessible name includes the visible EN/ع labels -->
      <button class="hidden sm:flex items-center gap-1.5 px-2.5 py-1.5 text-[11px] font-medium text-marsa-pearl/70 hover:text-marsa-pearl hover:bg-white/10 rounded-full transition-colors"
        type="button" (click)="preferences.toggleLocale()" [attr.aria-label]="text(navData.language) + ' — EN/ع'">
        <svg lucideGlobe class="w-3.5 h-3.5" aria-hidden="true"></svg>
        <span [class.font-bold]="preferences.locale() === 'en'" [class.opacity-50]="preferences.locale() !== 'en'">EN</span>
        <span class="opacity-40">/</span>
        <span [class.font-bold]="preferences.locale() === 'ar'" [class.opacity-50]="preferences.locale() !== 'ar'">ع</span>
      </button>

      <!-- Download CTA (desktop) — anchor to the #download section -->
      <a class="hidden md:inline-flex items-center gap-1.5 px-4 py-2 bg-marsa-sand hover:bg-marsa-sand-deep text-marsa-deep font-bold text-[11px] rounded-full transition-all hover:scale-105 tracking-wide"
        routerLink="/" fragment="download" (click)="closeMenu()">
        {{ text(navData.download) }}
        <svg lucideArrowUpRight class="w-3.5 h-3.5" aria-hidden="true"></svg>
      </a>
    </div>

    <!-- Mobile menu toggle — a direct child of the pill, pinned to the physical
         LEFT edge in both locales (hamburger-left pattern). Being outside the
         actions cluster keeps its left-3 anchor relative to the pill; the
         header's z-50 stacking keeps it clickable above the z-45 overlay. -->
    <button #menuToggle class="md:hidden absolute left-3 top-1/2 -translate-y-1/2 flex items-center justify-center w-8 h-8 text-marsa-pearl hover:bg-white/10 rounded-full transition-colors"
      type="button" (click)="toggleMenu()"
      [attr.aria-expanded]="isMenuOpen"
      aria-controls="mobile-menu"
      [attr.aria-label]="isMenuOpen ? text(navData.close) : text(navData.menu)">
      <svg *ngIf="!isMenuOpen" lucideMenu class="w-5 h-5" aria-hidden="true"></svg>
      <svg *ngIf="isMenuOpen"  lucideX    class="w-5 h-5" aria-hidden="true"></svg>
    </button>
  </div>
</header>

<!-- ═══════════════════════════════ MOBILE MENU ═══════════════════════════════ -->
<!-- Rendered only while open so its links never sit in the tab order invisibly.
     z-[45]: above the hero's z-40 slider dots + curved divider (they previously
     painted OVER the open menu at equal z-index per DOM order) and below the
     header's z-50 so the pill (with the close toggle) stays interactive. -->
<div *ngIf="isMenuOpen" id="mobile-menu"
  class="md:hidden fixed inset-0 z-[45] bg-marsa-deep/95 backdrop-blur-lg pt-24 px-6 pb-6 overflow-y-auto
         animate-[fade_0.4s_ease_both]">
  <div class="space-y-1">
    <p class="eyebrow text-marsa-pearl/50 mb-6">{{ text(navData.menu) }}</p>

    <!-- Language switch: reachable on small screens, same behaviour as desktop -->
    <button class="w-full flex items-center gap-2 px-2 py-4 text-lg font-semibold text-marsa-pearl border-b border-white/10 hover:text-marsa-sand transition-colors"
      type="button" (click)="preferences.toggleLocale()" [attr.aria-label]="text(navData.language) + ' — EN/ع'">
      <svg lucideGlobe class="w-5 h-5 opacity-60" aria-hidden="true"></svg>
      <span [class.font-bold]="preferences.locale() === 'en'" [class.opacity-50]="preferences.locale() !== 'en'">EN</span>
      <span class="opacity-40">/</span>
      <span [class.font-bold]="preferences.locale() === 'ar'" [class.opacity-50]="preferences.locale() !== 'ar'">ع</span>
    </button>

    <a routerLink="/" fragment="why"   class="flex items-center justify-between py-4 text-lg font-semibold text-marsa-pearl border-b border-white/10 hover:text-marsa-sand transition-colors" (click)="closeMenu()">
      {{ text(navData.why) }} <svg lucideArrowUpRight class="w-5 h-5 opacity-40" aria-hidden="true"></svg>
    </a>
    <a routerLink="/" fragment="how"   class="flex items-center justify-between py-4 text-lg font-semibold text-marsa-pearl border-b border-white/10 hover:text-marsa-sand transition-colors" (click)="closeMenu()">
      {{ text(navData.how) }} <svg lucideArrowUpRight class="w-5 h-5 opacity-40" aria-hidden="true"></svg>
    </a>
    <a routerLink="/" fragment="about" class="flex items-center justify-between py-4 text-lg font-semibold text-marsa-pearl border-b border-white/10 hover:text-marsa-sand transition-colors" (click)="closeMenu()">
      {{ text(navData.about) }} <svg lucideArrowUpRight class="w-5 h-5 opacity-40" aria-hidden="true"></svg>
    </a>
    <div class="pt-8">
      <a class="w-full flex items-center justify-center gap-2 py-3.5 px-6 bg-marsa-sand hover:bg-marsa-sand-deep text-marsa-deep font-bold text-sm rounded-full transition-all"
        routerLink="/" fragment="download" (click)="closeMenu()">
        {{ text(navData.download) }}
        <svg lucideArrowUpRight class="w-4 h-4" aria-hidden="true"></svg>
      </a>
    </div>
  </div>
</div>
