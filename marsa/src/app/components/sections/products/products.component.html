<!-- ── How it works (source: almarsa.app/en#how) ── -->
<section id="how" class="w-full section-offscreen bg-transparent" aria-labelledby="how-title">
  <div class="max-w-5xl mx-auto px-6 md:px-8 py-20 md:py-28 bg-transparent text-marsa-ink dark:text-marsa-dark-ink border-t border-marsa-warm/50 dark:border-marsa-dark-pearl/10">

    <div class="mb-14 reveal-up">
      <h2 id="how-title" class="mb-5">{{ text(copy.how.heading) }}</h2>
      <p class="text-lg opacity-70 max-w-xl leading-relaxed">{{ text(copy.how.lead) }}</p>
    </div>

    <!-- Four moves: browse (web) → book/pay/clear/check-in (app) -->
    <ol class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5 list-none">
      <li
        *ngFor="let step of copy.how.steps; let i = index"
        class="reveal-up rounded-marsa-md border border-marsa-warm/60 dark:border-white/10 bg-marsa-card dark:bg-marsa-dark-card p-6 flex flex-col gap-3"
        [style.transition-delay]="(i * 100) + 'ms'"
        [attr.aria-labelledby]="'how-step-' + i">
        <span class="text-3xl font-bold text-marsa-sand-deep dark:text-marsa-dark-sand" aria-hidden="true">{{ i + 1 }}</span>
        <h3 id="{{ 'how-step-' + i }}" class="text-base font-bold -tracking-[0.02em]">{{ text(step.title) }}</h3>
        <p class="text-sm opacity-60 leading-relaxed">{{ text(step.description) }}</p>
      </li>
    </ol>

    <!-- Real fleet filter taxonomy from the official site — labels only,
         no inventory. Mirrors units you can browse there before booking
         in the app. -->
    <div class="mt-14 reveal-up delay-200">
      <h3 class="text-[13px] font-medium tracking-wide opacity-70 mb-5">{{ text(copy.how.categoriesHeading) }}</h3>
      <ul class="flex flex-wrap gap-2.5">
        <li
          *ngFor="let category of categories"
          class="px-4 py-1.5 rounded-full border border-marsa-warm dark:border-white/15 text-[13px] font-medium opacity-80">
          {{ text(category.label) }}
        </li>
      </ul>
    </div>

  </div>
</section>
