    <!-- ── Why Al Marsa — four trust pillars (source: almarsa.app/en#why) ── -->
    <section id="why" class="w-full section-offscreen bg-transparent" aria-labelledby="why-title">
      <div class="max-w-5xl mx-auto px-6 md:px-8 py-20 md:py-28 bg-transparent text-marsa-ink dark:text-marsa-dark-ink">

        <div class="mb-14 reveal-up">
          <h2 id="why-title" class="mb-5">{{ text(copy.why.heading) }}</h2>
          <p class="text-lg opacity-70 max-w-xl leading-relaxed">{{ text(copy.why.lead) }}</p>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
          <article
            *ngFor="let card of copy.why.cards; let i = index"
            class="reveal-up rounded-marsa-md border border-marsa-warm/60 dark:border-white/10 bg-marsa-card dark:bg-marsa-dark-card p-6 flex flex-col gap-3"
            [style.transition-delay]="(i * 100) + 'ms'"
            [attr.aria-labelledby]="'why-card-' + i">
            <span class="text-[10px] font-mono tracking-[0.14em] text-marsa-sand-deep dark:text-marsa-dark-sand" aria-hidden="true">{{ (i + 1) < 10 ? '0' + (i + 1) : (i + 1) }}</span>
            <h3 id="{{ 'why-card-' + i }}" class="text-base font-bold -tracking-[0.02em]">{{ text(card.title) }}</h3>
            <p class="text-sm opacity-60 leading-relaxed">{{ text(card.description) }}</p>
          </article>
        </div>
      </div>
    </section>
