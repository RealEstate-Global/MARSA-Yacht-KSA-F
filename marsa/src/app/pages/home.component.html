<div
  #page
  class="min-h-screen overflow-hidden bg-marsa-pearl dark:bg-marsa-dark-canvas text-marsa-ink dark:text-marsa-dark-ink"
  [class.menu-open]="isMenuOpen"
  [attr.dir]="preferences.locale() === 'ar' ? 'rtl' : 'ltr'"
>
  <!-- ═══════════════════════════════ HEADER ═══════════════════════════════ -->
  <marsa-header (menuToggled)="setMenuOpen($event)"></marsa-header>

  <!-- ═══════════════════════════════ MAIN: why → how → about → download ═══════════════════════════════ -->
  <main>
    <app-hero></app-hero>
    <app-intro></app-intro>
    <app-products></app-products>
    <app-about></app-about>
    <app-cta></app-cta>
  </main>

  <!-- ═══════════════════════════════ FOOTER ═══════════════════════════════ -->
  <marsa-footer></marsa-footer>

</div>
