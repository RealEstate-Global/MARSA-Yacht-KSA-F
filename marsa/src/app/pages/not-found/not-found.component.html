<div
  class="relative min-h-screen flex flex-col justify-between bg-marsa-pearl dark:bg-marsa-dark-canvas text-marsa-ink dark:text-marsa-dark-ink transition-colors duration-300 overflow-hidden"
  [attr.dir]="preferences.locale() === 'ar' ? 'rtl' : 'ltr'"
>
  <!-- Atmospheric Nautical Glow -->
  <div class="absolute inset-0 pointer-events-none opacity-40 dark:opacity-25" aria-hidden="true">
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[800px] h-[450px] bg-gradient-to-b from-marsa-sea/20 to-transparent rounded-full blur-3xl"></div>
  </div>

  <!-- Header -->
  <marsa-header></marsa-header>

  <!-- 404 Main Content -->
  <main class="relative z-10 flex-1 flex items-center justify-center pt-32 sm:pt-40 pb-20 px-6">
    <div class="w-full max-w-2xl mx-auto text-center animate-rise">

      <!-- Eyebrow Badge -->
      <div class="flex justify-center mb-6">
        <app-badge variant="default" [pulse]="true">
          <svg lucideCompass class="w-4 h-4 animate-[spin_16s_linear_infinite]" aria-hidden="true"></svg>
          <span>{{ text(notFoundData.badge) }}</span>
        </app-badge>
      </div>

      <!-- Decorative 404 numeral; the localized page title remains accessible below. -->
      <div class="relative mb-2 select-none" aria-hidden="true">
        <span class="text-[clamp(100px,18vw,190px)] font-bold font-mono tracking-tighter text-marsa-sea/15 dark:text-white/10 leading-none block select-none">
          404
        </span>
      </div>

      <!-- Semantic Page Title -->
      <h1 class="text-3xl sm:text-4xl md:text-5xl font-bold tracking-tight text-marsa-ink dark:text-marsa-dark-ink drop-shadow-sm mb-5">
        {{ text(notFoundData.title) }}
      </h1>

      <!-- Description -->
      <p class="text-base md:text-lg text-marsa-ink/75 dark:text-marsa-dark-ink/70 leading-relaxed max-w-lg mx-auto mb-10">
        {{ text(notFoundData.description) }}
      </p>

      <!-- Reusable Action Buttons -->
      <div class="flex flex-wrap items-center justify-center gap-4 mb-14">
        <app-button
          routerLink="/"
          variant="primary"
        >
          <svg lucideHome class="w-4 h-4" aria-hidden="true"></svg>
          <span>{{ text(notFoundData.homeCta) }}</span>
        </app-button>

        <app-button
          routerLink="/"
          fragment="how"
          variant="secondary"
        >
          <span>{{ text(notFoundData.exploreCta) }}</span>
          <svg lucideArrowUpRight class="w-3.5 h-3.5" aria-hidden="true"></svg>
        </app-button>
      </div>

      <!-- Popular Charter Links -->
      <div class="border-t border-marsa-warm/70 dark:border-white/10 pt-8 max-w-lg mx-auto">
        <p class="text-xs uppercase tracking-wider font-semibold text-marsa-ink/60 dark:text-marsa-dark-ink/50 mb-4">
          {{ text(howData.categoriesHeading) }}
        </p>
        <div class="flex flex-wrap justify-center gap-2">
          <a
            *ngFor="let cat of categories"
            routerLink="/"
            fragment="how"
            class="marsa-tag">
            {{ text(cat.label) }}
          </a>
        </div>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <marsa-footer></marsa-footer>
</div>
