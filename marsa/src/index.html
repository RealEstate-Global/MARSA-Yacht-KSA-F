<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>Al Marsa — المرسى</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Verified yachts. Licensed captains. Coastguard-cleared. Clear pricing — pick the boat, book in the app." />
    <link rel="canonical" href="https://marsa-yacht.vercel.app/" />
    <!-- Open Graph / social cards. Single canonical URL: language is a client-side
         toggle (EN/AR share one URL), so hreflang alternates don't apply. -->
    <meta property="og:title" content="Al Marsa — المرسى" />
    <meta property="og:description" content="Verified yachts. Licensed captains. Coastguard-cleared. Clear pricing — pick the boat, book in the app." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Al Marsa" />
    <meta property="og:url" content="https://marsa-yacht.vercel.app/" />
    <meta property="og:image" content="https://marsa-yacht.vercel.app/assets/marsa-hero.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="1024" />
    <meta property="og:image:alt" content="Yacht on Gulf water — book verified yachts with licensed captains in the Al Marsa app" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ar_SA" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Al Marsa — المرسى" />
    <meta name="twitter:description" content="Verified yachts. Licensed captains. Coastguard-cleared. Clear pricing — pick the boat, book in the app." />
    <meta name="twitter:image" content="https://marsa-yacht.vercel.app/assets/marsa-hero.jpg" />
    <meta name="theme-color" content="#071417" />

    <!-- Structured data: entity definition only. No ratings, reviews,
         addresses, phone numbers, or store URLs are claimed — none are
         verifiable. Descriptions mirror the visible page copy (almarsa.app/en). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://marsa-yacht.vercel.app/#organization",
            "name": "Al Marsa",
            "alternateName": "المرسى",
            "url": "https://marsa-yacht.vercel.app/",
            "description": "Premium vessel-charter marketplace built for the Gulf — Saudi-first. Connects customers with verified yachts and boats, licensed captains, and an app-based booking flow with clear pricing and coastguard clearance.",
            "logo": "https://marsa-yacht.vercel.app/assets/favicon.svg",
            "sameAs": ["https://almarsa.app/"]
          },
          {
            "@type": "WebSite",
            "@id": "https://marsa-yacht.vercel.app/#website",
            "url": "https://marsa-yacht.vercel.app/",
            "name": "Al Marsa — المرسى",
            "inLanguage": ["en", "ar"],
            "publisher": { "@id": "https://marsa-yacht.vercel.app/#organization" }
          }
        ]
      }
    </script>

    <!-- ① Preconnect to Google Fonts — eliminates DNS/TLS latency -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- ② Fonts loaded async via media trick — non-render-blocking.
         Only the weights actually used by the app are requested; each unused
         weight saved is one fewer subset file for the browser to download. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&family=Cairo:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <!-- Fallback for JS-disabled browsers -->
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&family=Cairo:wght@400;500;600;700&display=swap" />
    </noscript>

    <!-- ③ Preload the LCP hero image — must match the slide-0 URL in
         hero.component.ts byte-for-byte so the browser reuses the preloaded
         resource instead of downloading it twice. -->
    <link rel="preload" as="image" href="/assets/marsa-hero.avif" fetchpriority="high" />

    <!-- ⑤ Inline critical above-the-fold CSS — prevents FOUC before stylesheet loads -->
    <style>
      *,*::before,*::after{box-sizing:border-box}
      html{scroll-behavior:smooth}
      body{
        margin:0;
        background:#f5f2eb;
        color:#122124;
        font-family:Manrope,'Cairo',sans-serif;
        -webkit-font-smoothing:antialiased;
      }
      body.dark{background:#07121a;color:#f2eee4}
      /* Skeleton navbar so layout doesn't shift */
      header{position:fixed;top:1rem;left:50%;transform:translateX(-50%);z-index:50;width:100%;max-width:64rem;padding:0 1rem}
      /* Hero placeholder background while image loads - scoped to app-hero */
      app-hero section{
        position:relative;min-height:100vh;
        background:#071417;
      }
      /* Prevent invisible text flash */
      h1,h2,h3{font-weight:700;letter-spacing:-0.04em}
    </style>

    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <marsa-root></marsa-root>
  </body>
</html>
