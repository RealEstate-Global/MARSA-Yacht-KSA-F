name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [24.x]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: marsa/package-lock.json
      
      - name: Install dependencies
        working-directory: marsa
        run: npm ci
      
      - name: Type check
        working-directory: marsa
        run: npm run typecheck

      - name: Unit tests
        working-directory: marsa
        run: npm run test
      
      - name: Build
        working-directory: marsa
        run: npm run build
      
      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: build-output
          path: marsa/dist/public
